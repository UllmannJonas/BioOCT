[project]
name = "bio_oct"
version = "0.4.2"
description = "A napari plugin for analyzing optical coherence tomography (OCT) from biofilm growing on substratum."
authors = [
  {name = "Andreas Netsch", email = "andreas.netsch@partner.kit.edu"},
  {name = "Jonas Ullmann", email = "ullmann@dvgw-ebi.de"},
  {name = "Matti Telgmann", email = "matti.telgmann@unibw.de"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
  "Framework :: napari",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Intended Audience :: Science/Research",
]
keywords = [
  "napari",
  "plugin",
  "biofilm",
  "optical coherence tomography",
  "OCT",
  "image analysis"
]
dependencies = [
  "numpy>=2.4.2",
  "magicgui>=0.10.1",
  "qtpy>=2.4.3",
  "opencv-python>=4.13.0.92",
  "medvol==0.0.22",
  "matplotlib>=3.10.8",
  "napari-nifti>=0.0.17",
  "scipy>=1.17.0",
  "scikit-image>=0.26.0",
  "tifffile>=2026.2.15",
]

[project.urls]
Homepage = "https://github.com/UllmannJonas/BioOCT"
Repository = "https://github.com/UllmannJonas/BioOCT"
Documentation = "https://github.com/UllmannJonas/BioOCT#readme"
Issues = "https://github.com/UllmannJonas/BioOCT/issues"

[dependency-groups]
additional = [
    "napari>=0.7.0",
    "pyqt6>=6.10.2",
]
dev = [
    "ruff>=0.15.1",
    "uv>=0.10.2",
    "pre-commit>=4.5.1",
    "pyright>=1.1.407",
    "pytest>=9.1.0",
    {include-group = "additional"},
]

[project.entry-points."napari.manifest"]
"BioOCT" = "bio_oct:napari.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_oct"]
include = ["src/bio_oct/napari.yaml"]

[tool.pyright]
exclude = ["tests", "**/node_modules", "**/__pycache__", "**/.*", "**/.venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
