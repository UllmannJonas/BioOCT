[project]
name = "oct_analysis"
version = "1.0.1"
description = "A package for analyzing optical coherence tomography (OCT) images for biofilm."
authors = [
  {name = "Andreas Netsch", email = "andreas.netsch@partner.kit.edu"},
  {name = "Jonas Ullmann", email = "ullmann@dvgw-ebi.de"},
  {name = "Matti Telgmann", email = "matti.telgmann@unibw.de"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = ["Framework :: napari"]
dependencies = [
  "napari>=0.6.1",
  "nibabel>=5.3.2",
  "pyqt6>=6.9.1",
  "numpy>=1.20.0",
  "magicgui>=0.9.2",
  "qtpy>=2.4.0",
  "scipy>=1.13.0",
  "matplotlib>=3.4.0",
  "tifffile>=2020.6.3",
]

[dependency-groups]
dev = [
    "ruff==0.12.0",
    "uv==0.6.0",
    "pre-commit==4.2.0",
    "pyright>=1.1.407",
]

[project.entry-points."napari.manifest"]
"OCTool" = "oct_analysis.napari_plugin:napari.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oct_analysis"]
include = ["src/oct_analysis/napari_plugin/napari.yaml"]
