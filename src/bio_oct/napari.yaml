# info: menu-command must be identical to command-id

name: bio_oct
display_name: BioOCT

contributions:
  # --- Contributions Definition ---
  commands:
  # Reader
  - id: bio_oct.oct_reader
    title: Read ".oct" files
    python_name: bio_oct._reader:get_reader_fn

  ## Widgets
  # Recording Panel
  - id: bio_oct.pipeline_manager
    title: Pipeline Manager
    python_name: bio_oct.panel:PipelineManager
  # Median Filter
  - id: bio_oct.median_filter
    title: Median Filter
    python_name: bio_oct.widgets:median_filter_widget
  # Gauss Filter
  - id: bio_oct.gauss_filter
    title: Gauss Filter
    python_name: bio_oct.widgets:gaussian_filter_widget
  # Sobel Filter
  - id: bio_oct.sobel_filter
    title: Sobel Filter
    python_name: bio_oct.widgets:sobel_filter_widget
  # Locate Intensity Coordinates
  - id: bio_oct.locate_intensity
    title: Locate Intensity
    python_name: bio_oct.widgets:LocateIntensityWidget
  # Define ROI
  - id: bio_oct.define_roi
    title: Define ROI
    python_name: bio_oct.widgets:DefineRoiWidget
  # # 8bit Converter
  # - id: bio_oct.convert_to_8bit
  #   title: Convert to 8bit
  #   python_name: bio_oct.widgets:convert_to_8bit_widget
  # Remove Small Objects
  - id: bio_oct.remove_outliers
    title: Remove Small Objects
    python_name: bio_oct.widgets:remove_outliers_widget
  # Interpolate Gaps
  - id: bio_oct.interpolate_gaps
    title: Interpolate Gaps
    python_name: bio_oct.widgets:interpolate_gaps_widget
  # Zero Out Areas
  - id: bio_oct.zero_out
    title: Zero Out Area
    python_name: bio_oct.widgets:zero_out_widget
  # Replace Reflection Lines
  - id: bio_oct.replace_reflection
    title: Replace Reflection
    python_name: bio_oct.widgets:replace_reflection_widget
  # Untilt
  - id: bio_oct.untilt
    title: Untilt
    python_name: bio_oct.widgets:untilt_widget
  # Enhance Contrast
  - id: bio_oct.enhance_contrast
    title: Enhance Contrast
    python_name: bio_oct.widgets:enhance_contrast_widget
  # Thresholding
  - id: bio_oct.threshold
    title: Thresholding
    python_name: bio_oct.widgets:ThresholdWidget
  # TIFF export
  - id: bio_oct.export_to_tiff
    title: Export to TIFF
    python_name: bio_oct.widgets:export_to_tiff_widget
  # NIfTI export
  - id: bio_oct.export_to_nifti
    title: Export to NIfTI
    python_name: bio_oct.widgets:export_to_nifti_widget
  # Height Map creation
  - id: bio_oct.height_map
    title: Create Height Map
    python_name: bio_oct.widgets:height_map_widget
  # Biovolume Map creation
  - id: bio_oct.bv_map
    title: Create BioVol Map
    python_name: bio_oct.widgets:bv_map_widget
  - id: bio_oct.save_metrics
    title: Save Metrics
    python_name: bio_oct.widgets:save_metrics_widget

  #*======================================
  # dev widgets
  - id: bio_oct.preview_height_map
    title: "dev: preview_height_map"
    python_name: bio_oct.widgets:preview_height_map_widget
  - id: bio_oct.print_metadata
    title: "dev: print_metadata"
    python_name: bio_oct.widgets:print_metadata
  - id: bio_oct.set_spacing
    title: "dev: set_spacing"
    python_name: bio_oct.widgets:set_spacing_widget
  - id: bio_oct.expand_coords
    title: "dev: expand_coords"
    python_name: bio_oct.widgets:expand_coords

  #* =============== Menu Items
  - id: bio_oct.scale1000
    title: Scale mm to µm
    python_name: bio_oct.menus:scale1000
  - id: bio_oct.plot_outliers
    title: Plot Object Sizes
    python_name: bio_oct.menus:plot_connected_components


  # --- Implementation/Registration ---
  # Reader hook
  readers:
  - command: bio_oct.oct_reader
    accepts_directories: true
    filename_patterns:
    - '*.oct'

  # Widget hooks
  widgets:
  - command: bio_oct.pipeline_manager
    display_name: Pipeline Manager
  # - command: bio_oct.convert_to_8bit
  #   display_name: Convert to 8bit
  - command: bio_oct.median_filter
    display_name: "Filter: Median"
  - command: bio_oct.gauss_filter
    display_name: "Filter: Gauss"
  - command: bio_oct.sobel_filter
    display_name: "Filter: Sobel"
  - command: bio_oct.locate_intensity
    display_name: Locate Intensity
  - command: bio_oct.define_roi
    display_name: Define ROI
  - command: bio_oct.remove_outliers
    display_name: Remove Small Objects
  - command: bio_oct.interpolate_gaps
    display_name: Interpolate Gaps
  - command: bio_oct.zero_out
    display_name: Zero Out Area
  - command: bio_oct.replace_reflection
    display_name: Replace Reflection
  - command: bio_oct.untilt
    display_name: Untilt
  - command: bio_oct.enhance_contrast
    display_name: Enhance Contrast
  - command: bio_oct.threshold
    display_name: Thresholding
  - command: bio_oct.export_to_tiff
    display_name: Export to TIFF
  - command: bio_oct.export_to_nifti
    display_name: Export to NIfTI
  - command: bio_oct.height_map
    display_name: Create Height Map
  - command: bio_oct.bv_map
    display_name: Create BioVol Map
  - command: bio_oct.save_metrics
    display_name: Save Metrics

  #*============================================
  # dev widgets
  - command: bio_oct.preview_height_map
    display_name: "dev: preview_height_map"
  - command: bio_oct.print_metadata
    display_name: "dev: print_metadata"
  - command: bio_oct.set_spacing
    display_name: "dev: set_spacing"
  - command: bio_oct.expand_coords
    display_name: "dev: expand_coords"

  #*===================== MENUS
  menus:
    napari/layers/visualize:
      - command: bio_oct.scale1000
      - command: bio_oct.plot_outliers