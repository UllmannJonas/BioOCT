# info: menu-command must be identical to command-id

name: bio_oct
display_name: BioOCT
visibility: public
categories: ["Annotation", "Image Processing", "IO", "Segmentation"]

contributions:
  # define comands
  commands:
  # Reader
  - id: bio_oct.oct_reader
    title: Read ".oct" files
    python_name: bio_oct._reader:get_reader_fn

  #*================ SAMPLE DATA
  - id: bio_oct.sample_membrane
    title: Membrane with Spacer
    python_name: bio_oct._sample_data:load_sample_membrane_w_spacer
  - id: bio_oct.sample_electrode_rough
    title: Rough Electrode
    python_name: bio_oct._sample_data:load_sample_rough_electrode
  - id: bio_oct.sample_electrode_smooth
    title: Smooth Electrode with Shadowing
    python_name: bio_oct._sample_data:load_sample_smooth_electrode_shadowed

  #*==================== WIDGET ITEMS
  # Recording Panel
  - id: bio_oct.pipeline_manager
    title: Pipeline Manager
    python_name: bio_oct.pipeline_manager.panel:PipelineManager
  # Median Filter
  - id: bio_oct.median_filter
    title: Median Filter
    python_name: bio_oct._widgets:median_filter_widget
  # Gauss Filter
  - id: bio_oct.gauss_filter
    title: Gauss Filter
    python_name: bio_oct._widgets:gaussian_filter_widget
  # Sobel Filter
  - id: bio_oct.sobel_filter
    title: Sobel Filter
    python_name: bio_oct._widgets:sobel_filter_widget
  # Locate Surface Coordinates
  - id: bio_oct.locate_surface
    title: Locate Surface
    python_name: bio_oct._widgets:LocateSurfaceWidget
  # Define ROI
  - id: bio_oct.define_roi
    title: Define ROI
    python_name: bio_oct._widgets:DefineRoiWidget
  # Remove Small Objects
  - id: bio_oct.remove_small_objects
    title: Remove Small Objects
    python_name: bio_oct._widgets:remove_small_objects_widget
  # Interpolate Gaps
  - id: bio_oct.interpolate_gaps
    title: Interpolate Gaps
    python_name: bio_oct._widgets:interpolate_gaps_widget
  # Zero Out Areas
  - id: bio_oct.zero_out_area
    title: Zero Out Area
    python_name: bio_oct._widgets:zero_out_area_widget
  # Replace Reflection Lines
  - id: bio_oct.replace_reflection
    title: Replace Reflection
    python_name: bio_oct._widgets:replace_reflection_widget
  # Untilt
  - id: bio_oct.untilt
    title: Untilt
    python_name: bio_oct._widgets:untilt_widget
  # Enhance Contrast
  - id: bio_oct.enhance_contrast
    title: Enhance Contrast
    python_name: bio_oct._widgets:enhance_contrast_widget
  # Thresholding
  - id: bio_oct.threshold
    title: Thresholding
    python_name: bio_oct._widgets:ThresholdWidget
  # TIFF export
  - id: bio_oct.export_to_tiff
    title: Export to TIFF
    python_name: bio_oct._widgets:export_to_tiff_widget
  # NIfTI export
  - id: bio_oct.export_to_nifti
    title: Export to NIfTI
    python_name: bio_oct._widgets:export_to_nifti_widget
  # Height Map creation
  - id: bio_oct.height_map
    title: Create Height Map
    python_name: bio_oct._widgets:create_height_map_widget
  # Biovolume Map creation
  - id: bio_oct.bv_map
    title: Create BioVol Map
    python_name: bio_oct._widgets:create_bv_map_widget
  # Calculate and save metrics
  - id: bio_oct.calculate_metrics
    title: Calculate Metrics
    python_name: bio_oct._widgets:calculate_metrics_widget

  #*============== DEV WIDGET ITEMS
  # dev widgets
  - id: bio_oct.print_metadata
    title: "dev: print_metadata"
    python_name: bio_oct._widgets:print_metadata
  - id: bio_oct.set_spacing
    title: "dev: set_spacing"
    python_name: bio_oct._widgets:set_spacing_widget
  - id: bio_oct.expand_coords
    title: "dev: expand_coords"
    python_name: bio_oct._widgets:expand_coords


  # register commands
  readers:
  - command: bio_oct.oct_reader
    accepts_directories: true
    filename_patterns:
    - '*.oct'

  sample_data:
  - command: bio_oct.sample_membrane
    key: membrane_w_spacer
    display_name: Membrane with Spacer
  - command: bio_oct.sample_electrode_rough
    key: electrode_rough
    display_name: Rough Electrode
  - command: bio_oct.sample_electrode_smooth
    key: electrode_smooth
    display_name: Smooth Electrode with Shadowing

  widgets:
  - command: bio_oct.pipeline_manager
    display_name: Pipeline Manager
  - command: bio_oct.median_filter
    display_name: "Filter: Median"
  - command: bio_oct.gauss_filter
    display_name: "Filter: Gauss"
  - command: bio_oct.sobel_filter
    display_name: "Filter: Sobel"
  - command: bio_oct.locate_surface
    display_name: Locate Surface
  - command: bio_oct.define_roi
    display_name: Define ROI
  - command: bio_oct.remove_small_objects
    display_name: Remove Small Objects
  - command: bio_oct.interpolate_gaps
    display_name: Interpolate Gaps
  - command: bio_oct.zero_out_area
    display_name: Zero Out Area
  - command: bio_oct.replace_reflection
    display_name: Replace Reflection
  - command: bio_oct.untilt
    display_name: Untilt
  - command: bio_oct.enhance_contrast
    display_name: Enhance Contrast
  - command: bio_oct.threshold
    display_name: Thresholding
  - command: bio_oct.export_to_tiff
    display_name: Export to TIFF
  - command: bio_oct.export_to_nifti
    display_name: Export to NIfTI
  - command: bio_oct.height_map
    display_name: Create Height Map
  - command: bio_oct.bv_map
    display_name: Create BioVol Map
  - command: bio_oct.calculate_metrics
    display_name: Calculate Metrics

  # dev widgets
  - command: bio_oct.print_metadata
    display_name: "dev: print_metadata"
  - command: bio_oct.set_spacing
    display_name: "dev: set_spacing"
  - command: bio_oct.expand_coords
    display_name: "dev: expand_coords"
