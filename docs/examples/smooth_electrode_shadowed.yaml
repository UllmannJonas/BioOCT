created with: smooth_electrode_shadowed
pipeline:
- step: 1
  function: sobel_filter
  input_layers:
    image: $base
  output_layer: $base_sobel
  params: {}
- step: 2
  function: locate_surface
  input_layers:
    image: $base_sobel
  output_layer: $base_sobel_surface-coords
  params:
    upper_bound: 361
    lower_bound: 382
    axial_offset: 0
- step: 3
  function: remove_small_objects
  input_layers:
    labels: $base_sobel_surface-coords
  output_layer: $base_sobel_surface-coords_cleaned
  params:
    max_object_size: 7
- step: 4
  function: interpolate_gaps
  input_layers:
    surface: $base_sobel_surface-coords_cleaned
  output_layer: $base_sobel_surface-coords_cleaned_interpolated
  params: {}
- step: 5
  function: zero_out_area
  input_layers:
    image: $base
    surface_coords: $base_sobel_surface-coords_cleaned_interpolated
  output_layer: $base_zeroed
  params:
    direction: below
- step: 6
  function: enhance_contrast
  input_layers:
    image: $base_zeroed
  output_layer: $base_zeroed_enhanced
  params:
    method: gamma
    gamma: 4.0
- step: 7
  function: enhance_contrast
  input_layers:
    image: $base_zeroed_enhanced
  output_layer: $base_zeroed_enhanced
  params:
    method: clip
    clip_low_pct: 5.0
    clip_high_pct: 99.89999999999995
- step: 8
  function: gaussian_filter
  input_layers:
    image: $base_zeroed_enhanced
  output_layer: $base_zeroed_enhanced_gauss
  params:
    sigma: 0.7
- step: 9
  function: threshold
  input_layers:
    image: $base_zeroed_enhanced_gauss
  output_layer: $base_zeroed_enhanced_gauss_binary
  params:
    method: otsu
