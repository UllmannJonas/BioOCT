stages:
  - lint
  # - test
  - build
  - deploy

variables:
  UV_SYSTEM_PYTHON: "1"
  UV_COMPILE_BYTECODE: "0"

default:
  image: python:3.12
  before_script:
    - pip install uv
    - uv sync

# ----------------------------------------
# LINTING (Ruff + Pyright)
# when: every push
# ----------------------------------------
lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run pyright
  allow_failure: false

# ----------------------------------------
# TESTING (matrix über Python-Versionen)
# when: every push
# ----------------------------------------
# test:
#   stage: test
#   parallel:
#     matrix:
#       - PYTHON_VERSION: "3.10"
#       - PYTHON_VERSION: "3.11"
#       - PYTHON_VERSION: "3.12"
#       - PYTHON_VERSION: "3.13"
#       - PYTHON_VERSION: "3.14"
#   image: python:${PYTHON_VERSION}
#   script:
#     - uv run pytest -q

# ----------------------------------------
# BUILD PACKAGE (sdist + wheel)
# when: only on tag push
# ----------------------------------------
build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - uv build --no-sources
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ----------------------------------------
# DEPLOY TO PYPI
# when: only on tag push
# ----------------------------------------
deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - uv publish -u __token__ -p $PYPI_TOKEN