stages:
  - lint
  - test
  - docs
  - build
  - deploy

variables:
  UV_SYSTEM_PYTHON: "1"
  UV_COMPILE_BYTECODE: "0"

default:
  image: python:3.12
  before_script:
    - pip install uv
    - uv sync

# ----------------------------------------
# LINTING (Ruff + Pyright)
# when: every push
# ----------------------------------------
lint:
  stage: lint
  script:
    - uv run ruff check --fix .
    #! only possible with bio-oct on pypi
    # - uv run pyright
  allow_failure: false

